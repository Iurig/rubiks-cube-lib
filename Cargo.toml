[package]
name = "rubiks-cube-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[dev-dependencies]
fastrand = "2.5.0"

[lints.clippy]
pedantic = {level = "warn", priority = -1}
nursery = {level = "warn", priority = -1}
unwrap_used = "warn"
todo = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
unimplemented = "warn"
panic_in_result_fn = "warn"
panic = "warn"
