[workspace]
members = [
  "crates/rubiks-cube",
  "crates/rubiks-cube-cli",
  "crates/twisty-puzzles-py",
  "tools/cargo-bin",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Iurig/rubiks"

[workspace.metadata.bin]
cargo-binstall = { version = "1.26.1" }
dprint = { version = "0.64.3" }

[profile.dev]
debug-assertions = true
incremental = true
opt-level = 1
overflow-checks = true

[workspace.metadata.kani.flags]
fail-fast = true
output-format = "terse"

[workspace.metadata.kani.unstable]
uninit-checks = true
