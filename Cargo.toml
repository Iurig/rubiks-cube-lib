[package]
name = "rubiks-cube-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fastrand = "2.5.0"

serde_json = "1.0"

[[bench]]
name = "solves"
harness = false

[lints.clippy]
pedantic = {level = "warn", priority = -1}
nursery = {level = "warn", priority = -1}
unwrap_used = "warn"
todo = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
unimplemented = "warn"
panic_in_result_fn = "warn"
panic = "warn"
