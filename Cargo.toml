[workspace]
members = [
    "crates/rubiks-cube",
    "crates/rubiks-cube-cli",
    "crates/twisty-puzzles-py",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Iurig/rubiks"

[profile.dev]
debug-assertions = true
incremental = true
opt-level = 1
overflow-checks = true

[workspace.metadata.kani.flags]
fail-fast = true
output-format = "terse"

[workspace.metadata.kani.unstable]
uninit-checks = true
