[package]
name = "rubiks-cube-lib"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
fastrand = "2.5.0"
log = "0.4.34"


[[bench]]
name = "solves"
harness = false

[lints.clippy]
pedantic = {level = "warn", priority = -1}
nursery = {level = "warn", priority = -1}
unwrap_used = "warn"
todo = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
unimplemented = "warn"
panic_in_result_fn = "warn"
panic = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
missing_debug_implementations = "warn"

[dev-dependencies]
env_logger = { version = "0.11.11", default-features = false }
