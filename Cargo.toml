[workspace]
members = [
  "crates/rubiks-cube",
  "crates/rubiks-cube-cli",
  "crates/twisty-puzzles-py",
]
resolver = "3"

[workspace.package]
edition    = "2024"
license    = "MIT"
readme     = "README.md"
repository = "https://github.com/Iurig/rubiks"


[workspace.metadata.bin]
dprint    = { version = "0.64.3" }
taplo-cli = { version = "0.10.0", bins = ["taplo"] }


[profile.dev]
debug-assertions = true
incremental      = true
opt-level        = 1
overflow-checks  = true
